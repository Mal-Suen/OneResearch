[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oneresearch"
dynamic = ["version"]
description = "OneResearch（一次调研）：把联网调研的多轮搜索阅读循环折叠为一次 MCP 工具调用"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "trafilatura>=1.12,<2",
]

[tool.setuptools.dynamic]
version = { attr = "oneresearch.__version__" }

[tool.setuptools]
packages = ["oneresearch"]
